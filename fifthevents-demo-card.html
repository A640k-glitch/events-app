<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fifthEvents — Book a Demo Illustration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap');

  :root{
    --bg: #FCEDFF;
    --navy: #150F45;
    --teal: #24B4AC;
    --indigo: #372F86;
    --lime: #8DC63F;
    --wave-a: #8B7CF6;
    --wave-b: #5B4FE0;
  }

  html,body{
    margin:0; padding:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    background: transparent;
  }

  .card{
    position:relative;
    width:800px; height:800px;
    background: var(--bg);
    border-radius: 40px;
    overflow:hidden;
    font-family: 'Manrope', sans-serif;
  }

  /* soft brand blobs for texture, matching hero language */
  .blob{
    position:absolute; border-radius:999px; filter: blur(2px); opacity:.55;
  }
  .blob-teal{
    width:260px; height:130px; background: var(--teal);
    top:-50px; right:-70px; transform: rotate(28deg);
    opacity:.35;
  }
  .blob-lav{
    width:220px; height:110px; background:#C9B8F2;
    bottom:-30px; left:-60px; transform: rotate(-20deg);
    opacity:.4;
  }
  .dotgrid{
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(21,15,69,0.06) 1.6px, transparent 1.6px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 70%);
  }

  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }

  .stack{
    position:relative;
    width:340px; height:340px;
  }

  .chip{
    position:absolute;
    left:50%; top:50%;
    width:230px; height:230px;
    margin-left:-115px; margin-top:-115px;
    border-radius:32px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 18px 40px rgba(21,15,69,0.16);
    opacity:0;
  }

  .chip img{ width:62%; height:62%; object-fit:contain; }

  .chip-finedge{ background:#ffffff; animation: deal-finedge 7s cubic-bezier(.22,1,.36,1) infinite; }
  .chip-bulkwave{ background: linear-gradient(160deg, var(--wave-a), var(--wave-b)); animation: deal-bulkwave 7s cubic-bezier(.22,1,.36,1) infinite; }
  .chip-kuleanpay{ background: var(--navy); animation: deal-kuleanpay 7s cubic-bezier(.22,1,.36,1) infinite; }
  .chip-emblem{ background:#ffffff; animation: deal-emblem 7s cubic-bezier(.22,1,.36,1) infinite; z-index:5; }
  .chip-emblem img{ width:52%; height:52%; }

  @keyframes deal-finedge{
    0%, 3%      { opacity:0; transform: translateY(90px) scale(.7) rotate(-10deg); }
    16%         { opacity:1; transform: translateY(0) scale(1) rotate(-10deg); }
    58%         { opacity:1; transform: translateY(0) scale(1) rotate(-10deg); }
    64%         { opacity:1; transform: translate(-158px, 34px) scale(1) rotate(-20deg); }
    86%         { opacity:1; transform: translate(-158px, 34px) scale(1) rotate(-20deg); }
    97%,100%    { opacity:0; transform: translate(-158px, 34px) scale(.85) rotate(-20deg); }
  }

  @keyframes deal-bulkwave{
    0%, 16%     { opacity:0; transform: translateY(90px) scale(.7) rotate(6deg); }
    18%         { opacity:0; transform: translateY(90px) scale(.7) rotate(6deg); }
    30%         { opacity:1; transform: translateY(-10px) scale(1) rotate(6deg); }
    58%         { opacity:1; transform: translateY(-10px) scale(1) rotate(6deg); }
    64%         { opacity:1; transform: translate(0px, -34px) scale(1) rotate(0deg); }
    86%         { opacity:1; transform: translate(0px, -34px) scale(1) rotate(0deg); }
    97%,100%    { opacity:0; transform: translate(0px, -34px) scale(.85) rotate(0deg); }
  }

  @keyframes deal-kuleanpay{
    0%, 29%     { opacity:0; transform: translateY(90px) scale(.7) rotate(-6deg); }
    31%         { opacity:0; transform: translateY(90px) scale(.7) rotate(-6deg); }
    43%         { opacity:1; transform: translateY(-4px) scale(1) rotate(8deg); }
    58%         { opacity:1; transform: translateY(-4px) scale(1) rotate(8deg); }
    64%         { opacity:1; transform: translate(158px, 34px) scale(1) rotate(20deg); }
    86%         { opacity:1; transform: translate(158px, 34px) scale(1) rotate(20deg); }
    97%,100%    { opacity:0; transform: translate(158px, 34px) scale(.85) rotate(20deg); }
  }

  @keyframes deal-emblem{
    0%, 42%     { opacity:0; transform: translateY(-70px) scale(.6) rotate(0deg); }
    44%         { opacity:0; transform: translateY(-70px) scale(.6) rotate(0deg); }
    52%         { opacity:1; transform: translateY(6px) scale(1.08) rotate(0deg); }
    56%         { opacity:1; transform: translateY(0px) scale(1) rotate(0deg); }
    64%         { opacity:1; transform: translate(0px, -96px) scale(1.06) rotate(0deg); }
    86%         { opacity:1; transform: translate(0px, -96px) scale(1.06) rotate(0deg); }
    97%,100%    { opacity:0; transform: translate(0px, -96px) scale(.9) rotate(0deg); }
  }

  .pill{
    position:absolute;
    left:50%; bottom:130px;
    transform: translate(-50%, 14px);
    opacity:0;
    padding:14px 26px;
    border-radius:999px;
    background: var(--navy);
    color:#fff;
    font-weight:700;
    font-size:17px;
    letter-spacing:.01em;
    white-space:nowrap;
    box-shadow: 0 12px 24px rgba(21,15,69,0.22);
    animation: pill-in 7s cubic-bezier(.22,1,.36,1) infinite;
  }

  @keyframes pill-in{
    0%, 71%    { opacity:0; transform: translate(-50%, 14px); }
    78%        { opacity:1; transform: translate(-50%, 0px); }
    92%        { opacity:1; transform: translate(-50%, 0px); }
    97%,100%   { opacity:0; transform: translate(-50%, 10px); }
  }

  .wordmark{
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    font-size:15px; font-weight:700; color: var(--navy);
    letter-spacing:.02em; opacity:.85;
  }
  .wordmark span{ color: var(--teal); }
</style>
</head>
